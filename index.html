  <body class="bg-[#090a0f] text-slate-100 select-none overflow-hidden font-sans antialiased">
    <div id="root">
      <!-- Instant First-Paint Splash (replaced automatically when React mounts) -->
      <div style="position:fixed;inset:0;z-index:9999;background:#060919;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <img src="/splash.jpg" alt="Dulos Editor" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
      </div>
    </div>
    <script>
      // Capture PWA install prompt early before lazy modals mount
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Watchdog: if React fails to mount (e.g. stale Chrome Service Worker / cached chunk mismatch),
      // clear SW caches and reload once automatically instead of freezing on splash.jpg.
      setTimeout(function () {
        if (window.__appMounted) return;
        var recover = async function () {
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (e) {}
          window.location.reload();
        };

        var alreadyRetried = false;
        try {
          alreadyRetried = sessionStorage.getItem('sw_recovery_reloaded') === '1';
          if (!alreadyRetried) {
            sessionStorage.setItem('sw_recovery_reloaded', '1');
            recover();
            return;
          }
        } catch (e) {}

        var root = document.getElementById('root');
        if (root && !document.getElementById('splash-recovery-banner')) {
          var banner = document.createElement('div');
          banner.id = 'splash-recovery-banner';
          banner.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:10000;background:rgba(9,10,15,0.92);border:1px solid rgba(255,255,255,0.16);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:12px;color:#e2e8f0;font-family:sans-serif;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,0.5);';
          var text = document.createElement('span');
          text.textContent = 'La app tardó demasiado en iniciar.';
          var btn = document.createElement('button');
          btn.textContent = 'Reintentar';
          btn.style.cssText = 'background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;';
          btn.onclick = function () {
            try { sessionStorage.removeItem('sw_recovery_reloaded'); } catch (e) {}
            recover();
          };
          banner.appendChild(text);
          banner.appendChild(btn);
          root.appendChild(banner);
        }
      }, 6000);
    </script>
    <script>
      // Register Service Worker for PWA installation (web only, skip inside Electron desktop app & Android APK)
      const isElectronApp = !!(window.electronAPI && window.electronAPI.isElectron) ||
        navigator.userAgent.toLowerCase().includes('electron');
      const isCapacitorApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
        !!window.DulosAndroid;
      if (!isElectronApp && !isCapacitorApp && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA ServiceWorker registered with scope:', registration.scope);
            })
            .catch((err) => {
              console.warn('PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
